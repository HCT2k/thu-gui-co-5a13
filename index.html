<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="54 lá thư các con lớp 5A13 gửi cô Nguyễn Thị Kim Chi nhân ngày 20/11">
<meta property="og:type" content="website">
<meta property="og:title" content="💌 54 lá thư gửi cô Kim Chi – Lớp 5A13">
<meta property="og:description" content="Nhân ngày Nhà giáo Việt Nam 20/11, các con lớp 5A13 Trường Tiểu học Cầu Diễn gửi tới cô những lời yêu thương. Bấm để xem!">
<meta property="og:image" content="https://hct2k.github.io/thu-gui-co-5a13/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://hct2k.github.io/thu-gui-co-5a13/">
<meta name="twitter:card" content="summary_large_image">
<title>Lời yêu thương gửi cô – 20/11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbf6ec; --ink:#3a2a2a; --rose:#b23a48; --rose-soft:#f3d6d6;
    --gold:#c9963b; --leaf:#4f7a5a; --dark:#1f1716;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--dark);color:var(--ink);
    font-family:"Be Vietnam Pro",system-ui,sans-serif}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

  /* ---------- Trang bìa ---------- */
  #cover{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
    background:radial-gradient(120% 90% at 50% 0%, #fff8ee 0%, var(--paper) 55%, #f1e4cf 100%);
    transition:opacity .7s ease, visibility .7s; z-index:5}
  #cover.hide{opacity:0;visibility:hidden}
  .petals{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .petal{position:absolute;top:-40px;width:18px;height:14px;border-radius:14px 0 14px 0;
    background:var(--rose-soft);opacity:.8;animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
  .date{font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .cover-title{font-family:"Dancing Script",cursive;font-size:clamp(40px,10vw,78px);line-height:1.05;
    color:var(--rose);margin:14px 0 6px}
  .teacher{font-size:clamp(18px,4.6vw,26px);font-weight:600;margin-top:4px}
  .klass{font-size:15px;opacity:.75;margin-top:6px}
  .ornament{width:120px;height:20px;margin:22px auto}
  .count-note{font-size:14px;opacity:.7;max-width:320px;line-height:1.5}
  #openBtn{margin-top:28px;padding:16px 34px;border-radius:999px;background:var(--rose);color:#fff;
    font-weight:600;font-size:17px;box-shadow:0 10px 30px -10px rgba(178,58,72,.7);
    animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.04)}}

  /* ---------- Trình xem ảnh ---------- */
  #viewer{position:fixed;inset:0;display:flex;flex-direction:column;
    background:radial-gradient(120% 80% at 50% 0%, #fffaf2 0%, var(--paper) 50%, #f0e2cb 100%)}
  .deco{position:absolute;bottom:-6px;width:min(34vw,230px);pointer-events:none;z-index:0;
    filter:drop-shadow(0 6px 10px rgba(120,60,50,.18))}
  .deco.bl{left:-8px}
  .deco.br{right:-8px}
  #viewer .petals{z-index:0}
  .topbar,.bottombar{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:10px 14px;color:var(--ink);z-index:2;position:relative}
  .topbar{padding-top:calc(10px + env(safe-area-inset-top))}
  .bottombar{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .counter{font-size:14px;font-variant-numeric:tabular-nums;color:#7a5a52}
  .mini-title{font-family:"Dancing Script",cursive;font-size:26px;color:var(--rose)}
  .icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    background:#fff;color:var(--rose);box-shadow:0 3px 10px -4px rgba(120,60,50,.35)}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .icon-btn.on{background:var(--rose);color:#fff}
  .group{display:flex;gap:8px}

  #stage{position:relative;flex:1;overflow:hidden;touch-action:pan-y;z-index:1}
  #track{position:absolute;inset:0;display:flex;transition:transform .38s cubic-bezier(.2,.7,.2,1)}
  .slide{flex:0 0 100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:18px 16px 4px;overflow:hidden}
  .card{position:relative;max-width:100%;max-height:calc(100% - 40px);display:flex;
    transform:rotate(var(--tilt,0deg));transition:transform .5s}
  .card img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px;background:#fff;
    padding:7px;box-shadow:0 2px 4px rgba(90,50,40,.12),0 22px 44px -18px rgba(90,50,40,.55);
    user-select:none;-webkit-user-drag:none}
  .pin{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f08a95, var(--rose) 55%, #7d1f2b);
    box-shadow:0 4px 6px -2px rgba(0,0,0,.4)}
  .caption{font-family:"Dancing Script",cursive;font-size:24px;color:var(--rose);margin-top:8px;line-height:1}
  .slide.zoom{overflow:auto;display:block;padding:0;touch-action:auto}
  .slide.zoom .card{transform:none;max-height:none;display:block}
  .slide.zoom img{max-width:none;max-height:none;width:220%;padding:0;box-shadow:none}
  .slide.zoom .pin,.slide.zoom .caption{display:none}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;
    display:grid;place-items:center;background:rgba(255,255,255,.9);color:var(--rose);z-index:2;
    box-shadow:0 6px 16px -6px rgba(120,60,50,.45)}
  .nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
  #prev{left:10px} #next{right:10px}
  @media (hover:none){.nav{display:none}}
  .hint{position:absolute;left:50%;top:6px;z-index:3;transform:translateX(-50%);background:rgba(0,0,0,.55);
    color:#fff;font-size:13px;padding:8px 14px;border-radius:999px;transition:opacity .6s;pointer-events:none;white-space:nowrap}

  /* trang kết */
  .ending{max-width:440px;text-align:center;color:var(--ink);padding:20px}
  .ending h2{font-family:"Dancing Script",cursive;font-size:clamp(46px,12vw,72px);color:var(--rose);line-height:1.1}
  .ending p{margin-top:14px;line-height:1.7;opacity:.9}
  .ending .again{margin-top:26px;padding:12px 26px;border-radius:999px;border:1px solid var(--rose);color:var(--rose)}

  .progress{height:3px;background:rgba(178,58,72,.12);margin:0 14px;border-radius:3px;position:relative;z-index:2}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--rose));border-radius:3px;transition:width .38s}

  /* lưới ảnh */
  #grid{position:fixed;inset:0;background:var(--paper);z-index:4;display:none;flex-direction:column}
  #grid.show{display:flex}
  #grid .list{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
    gap:8px;padding:12px 12px calc(16px + env(safe-area-inset-bottom))}
  #grid .list button{position:relative;aspect-ratio:3/4;border-radius:4px;overflow:hidden;background:#fff;
    box-shadow:0 6px 14px -8px rgba(90,50,40,.5)}
  #grid .list img{width:100%;height:100%;object-fit:cover}
  #grid .list span{position:absolute;left:4px;bottom:4px;font-size:11px;background:var(--rose);color:#fff;
    padding:1px 6px;border-radius:8px}
</style>
</head>
<body>

<!-- ===== TRANG BÌA ===== -->
<section id="cover">
  <div class="petals" id="petals"></div>
  <div class="date">20 · 11 · 2026</div>
  <h1 class="cover-title">Lời yêu thương<br>gửi cô</h1>
  <div class="teacher" id="teacherName"></div>
  <div class="klass" id="className"></div>
  <svg class="ornament" viewBox="0 0 120 20" aria-hidden="true">
    <path d="M2 10 H46 M74 10 H118" stroke="#c9963b" stroke-width="1.2"/>
    <path d="M60 2 C66 8 66 12 60 18 C54 12 54 8 60 2Z" fill="#b23a48"/>
    <circle cx="50" cy="10" r="2" fill="#c9963b"/><circle cx="70" cy="10" r="2" fill="#c9963b"/>
  </svg>
  <p class="count-note" id="countNote"></p>
  <button id="openBtn">💌 Chạm để mở thư</button>
</section>

<!-- ===== TRÌNH XEM ===== -->
<section id="viewer" aria-label="Trình xem lời chúc">
  <div class="petals" id="petals2"></div>
  <img class="deco bl" src="roses.png" alt="" aria-hidden="true">
  <img class="deco br" src="roses-r.png" alt="" aria-hidden="true">
  <div class="topbar">
    <div class="mini-title">Gửi cô</div>
    <div class="counter" id="counter"></div>
    <div class="group">
      <button class="icon-btn" id="gridBtn" aria-label="Xem tất cả">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>
      </button>
    </div>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <div id="stage">
    <div id="track"></div>
    <button class="nav" id="prev" aria-label="Ảnh trước"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
    <button class="nav" id="next" aria-label="Ảnh sau"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="hint" id="hint">Vuốt sang để xem tiếp · Chạm 2 lần để phóng to</div>
  </div>
  <div class="bottombar">
    <button class="icon-btn" id="musicBtn" aria-label="Bật/tắt nhạc (loa)">
      <svg viewBox="0 0 24 24" id="spk"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M17 9l5 6M22 9l-5 6" style="display:none"/></svg>
    </button>
    <div class="counter" id="autoLabel">Tự chuyển: tắt</div>
    <button class="icon-btn" id="autoBtn" aria-label="Tự động chuyển ảnh">
      <svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg>
    </button>
  </div>
</section>

<!-- ===== LƯỚI ẢNH ===== -->
<section id="grid">
  <div class="topbar">
    <div class="mini-title">Tất cả lời chúc</div>
    <button class="icon-btn" id="closeGrid" aria-label="Đóng"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="list" id="gridList"></div>
</section>

<audio id="music" src="music.mp3" loop preload="auto"></audio>

<script>
/* ============ THÔNG TIN CẦN SỬA ============ */
const CONFIG = {
  teacher: "Cô Nguyễn Thị Kim Chi",
  klass:   "Lớp 5A13 · Trường Tiểu học Cầu Diễn",
  photoCount: 54,                        // số ảnh trong thư mục photos (01.jpg, 02.jpg, …)
  ending: "Cảm ơn cô vì những ngày tháng tận tụy, yêu thương và dìu dắt chúng con. Chúc cô luôn mạnh khỏe, hạnh phúc và mãi rạng rỡ trên bục giảng!",
  autoSeconds: 6
};
/* =========================================== */

const COVER = "photos/00.jpg";   // ảnh bìa lớp gửi cô
const photos = Array.from({length: CONFIG.photoCount}, (_, i) => `photos/${String(i+1).padStart(2,"0")}.jpg`);
const $ = id => document.getElementById(id);
$("teacherName").textContent = CONFIG.teacher;
$("className").textContent = CONFIG.klass;
$("countNote").textContent = `${photos.length} lá thư nhỏ các con viết tặng cô nhân Ngày Nhà giáo Việt Nam`;

/* cánh hoa rơi */
for (let i = 0; i < 16; i++) {
  const p = document.createElement("i");
  p.className = "petal";
  p.style.left = Math.random()*100 + "%";
  p.style.animationDuration = 7 + Math.random()*8 + "s";
  p.style.animationDelay = -Math.random()*12 + "s";
  p.style.transform = `scale(${.6 + Math.random()*.8})`;
  if (i % 3 === 0) p.style.background = "#f6e2b8";
  $("petals").appendChild(p);
  if (i % 2 === 0) $("petals2").appendChild(p.cloneNode());
}

/* dựng slide */
const track = $("track");
const items = [COVER, ...photos];
const total = items.length + 1; // + trang kết
items.forEach((src, j) => {
  const i = j - 1;   // -1 = ảnh bìa
  const s = document.createElement("div");
  s.className = "slide";
  const card = document.createElement("div");
  card.className = "card";
  card.style.setProperty("--tilt", i < 0 ? "0deg" : [-1.2, .8, -.5, 1.1, -.9, .4][i % 6] + "deg");
  const img = document.createElement("img");
  img.alt = i < 0 ? "Gửi ngàn yêu thương tới thầy cô – 5A13" : `Lời chúc số ${i+1}`;
  img.dataset.src = src;
  img.draggable = false;
  card.append(Object.assign(document.createElement("span"), {className: "pin"}), img);
  const cap = Object.assign(document.createElement("div"), {className: "caption", textContent: i < 0 ? "Lớp 5A13 gửi cô ♥" : `Lá thư thứ ${i+1}`});
  s.append(card, cap);
  track.appendChild(s);
});
const end = document.createElement("div");
end.className = "slide";
end.innerHTML = `<div class="ending"><h2>Cảm ơn cô!</h2><p></p><button class="again">Xem lại từ đầu</button></div>`;
end.querySelector("p").textContent = CONFIG.ending;
end.querySelector(".again").onclick = () => go(0);
track.appendChild(end);
const slides = [...track.children];

let idx = 0;
function load(i){ const img = slides[i]?.querySelector("img"); if (img && !img.src) img.src = img.dataset.src; }
function go(i){
  idx = Math.max(0, Math.min(total-1, i));
  slides.forEach(s => s.classList.remove("zoom"));
  track.style.transform = `translateX(${-idx*100}%)`;
  [idx-1, idx, idx+1, idx+2].forEach(load);
  $("counter").textContent = (idx === 0 || idx === total-1) ? "♥" : `${idx} / ${photos.length}`;
  $("bar").style.width = `${(idx+1)/total*100}%`;
  if (idx === total-1) stopAuto();
}
$("prev").onclick = () => { go(idx-1); resetAuto(); };
$("next").onclick = () => { go(idx+1); resetAuto(); };
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { go(idx+1); resetAuto(); }
  if (e.key === "ArrowLeft")  { go(idx-1); resetAuto(); }
});

/* vuốt */
const stage = $("stage");
let sx = 0, sy = 0, dx = 0, dragging = false, lastTap = 0;
stage.addEventListener("touchstart", e => {
  if (slides[idx].classList.contains("zoom")) return;
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; dragging = true;
  track.style.transition = "none";
}, {passive:true});
stage.addEventListener("touchmove", e => {
  if (!dragging) return;
  dx = e.touches[0].clientX - sx;
  const dy = e.touches[0].clientY - sy;
  if (Math.abs(dy) > Math.abs(dx) && Math.abs(dx) < 10) return;
  track.style.transform = `translateX(calc(${-idx*100}% + ${dx}px))`;
}, {passive:true});
stage.addEventListener("touchend", () => {
  if (!dragging) return;
  dragging = false; track.style.transition = "";
  if (dx < -50) go(idx+1); else if (dx > 50) go(idx-1); else go(idx);
  if (Math.abs(dx) > 50) resetAuto();
});

/* chạm 2 lần để phóng to / thu nhỏ */
function toggleZoom(){
  const s = slides[idx];
  if (!s.querySelector("img")) return;
  s.classList.toggle("zoom");
  if (s.classList.contains("zoom")) { stopAuto(); s.scrollTo((s.scrollWidth - s.clientWidth)/2, 0); }
}
stage.addEventListener("touchend", e => {
  const now = Date.now();
  if (now - lastTap < 300 && Math.abs(dx) < 10) { toggleZoom(); lastTap = 0; } else lastTap = now;
});
stage.addEventListener("dblclick", toggleZoom);

/* gợi ý */
let hintTimer;
function showHint(){ $("hint").style.opacity = 1; clearTimeout(hintTimer); hintTimer = setTimeout(() => $("hint").style.opacity = 0, 3500); }

/* nhạc: tự phát ngay từ đầu, bấm loa để tắt */
const music = $("music");
let musicOk = true, userMuted = false;
music.volume = 0.8;
function paintSpk(){
  const on = !music.paused;
  $("musicBtn").classList.toggle("on", on);
  document.querySelector("#spk .w").style.display = on ? "" : "none";
  document.querySelector("#spk .x").style.display = on ? "none" : "";
}
music.addEventListener("play", paintSpk); music.addEventListener("pause", paintSpk);
music.addEventListener("error", () => { musicOk = false; $("musicBtn").style.opacity = .35; });
function tryPlay(){ if (musicOk && !userMuted && music.paused) music.play().catch(() => {}); }
tryPlay();                                   // thử phát ngay khi mở trang
["pointerdown","touchstart","keydown"].forEach(ev =>
  addEventListener(ev, tryPlay, {passive:true}));   // trình duyệt chặn thì phát ở lần chạm đầu tiên
$("musicBtn").addEventListener("click", e => {
  e.stopPropagation();
  if (music.paused) { userMuted = false; music.play().catch(() => {}); }
  else { userMuted = true; music.pause(); }
});
$("musicBtn").addEventListener("pointerdown", e => e.stopPropagation());
paintSpk();

/* tự chuyển */
let autoTimer = null;
function startAuto(){ stopAuto(); autoTimer = setInterval(() => go(idx+1), CONFIG.autoSeconds*1000);
  $("autoBtn").classList.add("on"); $("autoLabel").textContent = "Tự chuyển: bật"; }
function stopAuto(){ clearInterval(autoTimer); autoTimer = null;
  $("autoBtn").classList.remove("on"); $("autoLabel").textContent = "Tự chuyển: tắt"; }
function resetAuto(){ if (autoTimer) startAuto(); }
$("autoBtn").onclick = () => autoTimer ? stopAuto() : startAuto();

/* lưới */
const gl = $("gridList");
items.forEach((src, i) => {
  const b = document.createElement("button");
  b.innerHTML = `<img loading="lazy" alt=""><span>${i ? i : "♥"}</span>`;
  b.onclick = () => { $("grid").classList.remove("show"); go(i); };
  gl.appendChild(b);
});
$("gridBtn").onclick = () => {
  gl.querySelectorAll("img").forEach((im, i) => { if (!im.src) im.src = items[i]; });
  $("grid").classList.add("show");
};
$("closeGrid").onclick = () => $("grid").classList.remove("show");

/* mở thư */
$("openBtn").onclick = () => {
  $("cover").classList.add("hide");
  tryPlay();
  go(0);
  showHint();
};
go(0);
</script>
</body>
</html>
